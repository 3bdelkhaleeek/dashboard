<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense & Income Management | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #3b82f6; --primary-hover: #2563eb; --secondary: #1e293b;
            --bg-color: #f8fafc; --card-bg: #ffffff; --text-main: #0f172a;
            --text-muted: #64748b; --border: #e2e8f0; --green: #10b981;
            --orange: #f59e0b; --red: #ef4444;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        #login-screen {
            display: flex; justify-content: center; align-items: center; min-height: 80vh;
        }
        .login-card {
            background: var(--card-bg); padding: 40px; border-radius: 20px; box-shadow: var(--shadow-md);
            border: 1px solid var(--border); width: 100%; max-width: 400px; text-align: center;
        }
        .login-card h2 { margin-bottom: 25px; color: var(--secondary); font-size: 1.8rem; }
        .login-card .form-group { margin-bottom: 20px; text-align: right; }
        .login-card .btn { width: 100%; padding: 14px; font-size: 1.1rem; }

        #app-screen { display: none; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .header-title { display: flex; align-items: center; gap: 10px; font-size: 1.5rem; font-weight: 800; color: var(--secondary); }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .user-badge { background: #e0f2fe; color: #0369a1; padding: 6px 12px; border-radius: 8px; font-weight: bold; font-size: 0.95rem; }
        .live-badge { background-color: var(--red); color: white; font-size: 0.8rem; padding: 3px 8px; border-radius: 12px; font-weight: bold; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: 700; transition: all 0.3s; }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-danger { background-color: var(--red); color: white; }
        .btn-outline { background-color: transparent; border: 2px solid var(--border); color: var(--text-main); }
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: var(--shadow-md); border: 1px solid var(--border); position: relative; }
        .card-icon { position: absolute; top: 20px; left: 20px; font-size: 2rem; color: var(--text-muted); opacity: 0.2; }
        .card h3 { font-size: 1.1rem; color: var(--text-muted); margin-bottom: 12px; }
        .card .value { font-size: 2rem; font-weight: 800; }
        .card.final { color: white; border: none; }
        .card.final .card-icon { color: white; opacity: 0.3; }
        .card.final h3 { color: rgba(255, 255, 255, 0.9); }
        .final-green { background: linear-gradient(135deg, #10b981, #059669); }
        .final-orange { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .final-red { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .main-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 25px; }
        @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }
        .section { background: var(--card-bg); padding: 25px; border-radius: 16px; box-shadow: var(--shadow-md); border: 1px solid var(--border); margin-bottom: 25px; }
        .section-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 20px; color: var(--secondary); font-size: 1.3rem; border-bottom: 2px solid var(--bg-color); padding-bottom: 10px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 700; color: var(--secondary); }
        .form-control { width: 100%; padding: 12px 16px; border: 2px solid var(--border); border-radius: 10px; font-size: 1.1rem; }
        .input-lg { font-size: 1.5rem; font-weight: 700; text-align: center; }
        .cash-grid { display: grid; grid-template-columns: 80px 1fr 120px; gap: 15px; align-items: center; padding: 12px 0; border-bottom: 1px dashed var(--border); }
        .denom-label { font-weight: 800; font-size: 1.3rem; text-align: right; background: var(--bg-color); padding: 8px; border-radius: 8px; }
        .total-denom { font-weight: 800; font-size: 1.2rem; color: var(--primary); direction: ltr; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: right; border-bottom: 1px solid var(--border); vertical-align: top; }
        th { background-color: var(--bg-color); color: var(--text-muted); }
        .bill-item { font-size: 0.95rem; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px dashed var(--border); position: relative; }
        .bill-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .bill-actions-left { display: flex; align-items: center; gap: 10px; }
        .calc-checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary); }
        .delete-btn { background: var(--red); color: white; border: none; width: 26px; height: 26px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: 0.2s; }
        .delete-btn:hover { background: #dc2626; transform: scale(1.1); }
        .bill-time { color: #475569; font-size: 0.85rem; display: inline-block; background: #f1f5f9; padding: 4px 8px; border-radius: 6px; border: 1px solid #cbd5e1; font-weight: 500; }
        .bill-thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; display: block; margin-top: 5px; }
        .toast { position: fixed; bottom: 30px; left: 30px; background: #1f2937; color: white; padding: 15px 25px; border-radius: 10px; display: flex; align-items: center; gap: 10px; transform: translateY(100px); opacity: 0; transition: all 0.4s; z-index: 1000; }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast-success { border-right: 5px solid var(--green); }
        .toast-error { border-right: 5px solid var(--red); }
        .img-modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .img-modal-content { max-width: 90%; max-height: 90%; border-radius: 8px; border: 3px solid white; }
        .close-modal { position: absolute; top: 20px; right: 30px; color: white; font-size: 40px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-card">
        <h2>تسجيل الدخول</h2>
        <form id="login-form">
            <div class="form-group">
                <label>أدخل HRID</label>
                <input type="text" id="login-hrid" class="form-control" required placeholder="مثال: 16791">
            </div>
            <div class="form-group" id="password-group" style="display: none;">
                <label>كلمة المرور</label>
                <input type="password" id="login-pass" class="form-control" placeholder="أدخل كلمة المرور">
            </div>
            <button type="submit" class="btn btn-primary" id="login-btn">دخول</button>
        </form>
    </div>
</div>

<div id="app-screen" class="container">
    <header>
        <div class="header-title">
            <i class="fa-solid fa-cash-register text-primary"></i> Expense & Income Management <span class="live-badge">LIVE</span>
        </div>
        <div class="header-actions no-print">
            <span class="user-badge" id="current-user-display"></span>
            <button class="btn btn-outline" onclick="window.print()"><i class="fa-solid fa-print"></i> طباعة</button>
            <button class="btn btn-danger" onclick="window.logout()"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
        </div>
    </header>

    <div class="summary-grid">
        <div class="card">
            <h3>مبلغ cashmangment</h3>
            <div class="value" id="card-expected">0</div>
        </div>
        <div class="card">
            <h3>إجمالي النقدية (الفعلي)</h3>
            <div class="value" id="card-total-cash">0</div>
        </div>
        <div class="card">
            <h3>الفارق</h3>
            <div class="value" id="card-difference">0</div>
        </div>
        <div class="card">
            <h3>إجمالي المسحوبات</h3>
            <div class="value" id="card-total-bills">0</div>
        </div>
        <div class="card final" id="card-final-wrapper">
            <h3>الرصيد النهائي</h3>
            <div class="value" id="card-final" style="direction: ltr; text-align: right;">0</div>
        </div>
    </div>

    <div class="main-grid">
        <div>
            <div class="section">
                <h2 class="section-header">مبلغ cashmangment</h2>
                <div class="form-group">
                    <input type="number" id="expected-cash-input" class="form-control input-lg" placeholder="أدخل الرقم..." min="0">
                </div>
            </div>
            <div class="section">
                <h2 class="section-header">
                    <span>الفئات</span>
                    <button class="btn btn-outline btn-small no-print" onclick="window.resetDenominations()">
                        <i class="fa-solid fa-eraser"></i> تصفير الفئات
                    </button>
                </h2>
                <div id="cash-inputs-container"></div>
            </div>
        </div>

        <div>
            <div class="section no-print">
                <h2 class="section-header">إضافة سحب / فاتورة</h2>
                <form id="bill-form">
                    <div class="form-group">
                        <label>الاسم (اختر العميل)</label>
                        <select id="bill-name" class="form-control" required>
                            <option value="">-- اختر الاسم --</option>
                            <option value="Abdelkhalek">Abdelkhalek</option>
                            <option value="Youssef">Youssef</option>
                            <option value="Mohamed Khaled">Mohamed Khaled</option>
                            <option value="Malizi">Malizi</option>
                            <option value="Ezzat">Ezzat</option>
                            <option value="Abdelsalam">Abdelsalam</option>
                            <option value="Mohamed Ayman">Mohamed Ayman</option>
                            <option value="Bibo">Bibo</option>
                        </select>
                    </div>
                    <div class="form-group"><label>المبلغ</label><input type="number" id="bill-amount" class="form-control" required min="1"></div>
                    <div class="form-group"><label>السبب</label><input type="text" id="bill-reason" class="form-control"></div>
                    <div class="form-group"><label>إرفاق صورة</label><input type="file" id="bill-image" class="form-control" accept="image/*"></div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px;" id="submit-btn">حفظ السحب</button>
                </form>
            </div>
            <div class="section">
                <h2 class="section-header">سجل الفواتير</h2>
                <table>
                    <thead><tr><th>الاسم</th><th>التفاصيل</th><th>الإجمالي</th></tr></thead>
                    <tbody id="bills-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div id="imgModal" class="img-modal" onclick="window.closeImageModal()">
    <span class="close-modal">&times;</span><img class="img-modal-content" id="expandedImg">
</div>
<div id="toast" class="toast toast-success"><i id="toast-icon" class="fa-solid fa-circle-check"></i> <span id="toast-message">تم</span></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDgcFqvA97M5O6Ae3GTdps0Ao0VcukbbrU",
        authDomain: "abdelkhalek-cashapp.firebaseapp.com",
        projectId: "abdelkhalek-cashapp",
        storageBucket: "abdelkhalek-cashapp.firebasestorage.app",
        messagingSenderId: "944250701564",
        appId: "1:944250701564:web:49cd6f2f75d0f946a73979",
        databaseURL: "https://abdelkhalek-cashapp-default-rtdb.firebaseio.com" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'cashAppLiveState');

    const users = {
        "16791": { name: "Abdelkhalek", pass: "141203" },
        "1999":  { name: "Youssef", pass: "5503" },
        "22798": { name: "Mohamed Khaled", pass: "" },
        "2641":  { name: "Malizi", pass: "" },
        "44342": { name: "Ezzat", pass: "" },
        "60393": { name: "Abdelsalam", pass: "" },
        "24538": { name: "Bibo", pass: "" }
    };

    let currentUser = null;
    const defaultState = { expectedCash: 0, denominations: { 200:0, 100:0, 50:0, 20:0, 10:0, 5:0, 1:0 }, bills: [] };
    let state = JSON.parse(JSON.stringify(defaultState));
    const denomsList = [200, 100, 50, 20, 10, 5, 1];
    const formatNum = (num) => Number(num).toLocaleString('en-US');

    const hridInput = document.getElementById('login-hrid');
    const passGroup = document.getElementById('password-group');
    const passInput = document.getElementById('login-pass');

    hridInput.addEventListener('input', () => {
        const val = hridInput.value.trim();
        if (users[val] && users[val].pass !== "") {
            passGroup.style.display = 'block';
            passInput.required = true;
        } else {
            passGroup.style.display = 'none';
            passInput.required = false;
            passInput.value = '';
        }
    });

    document.getElementById('login-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const hrid = hridInput.value.trim();
        const pass = passInput.value.trim();

        if (!users[hrid]) {
            showToast('HRID غير صحيح', 'error');
            return;
        }

        if (users[hrid].pass !== "" && users[hrid].pass !== pass) {
            showToast('كلمة المرور غير صحيحة', 'error');
            return;
        }

        currentUser = users[hrid].name;
        document.getElementById('current-user-display').innerText = `المستخدم: ${currentUser}`;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        
        initApp();
    });

    window.logout = function() {
        currentUser = null;
        document.getElementById('app-screen').style.display = 'none';
        document.getElementById('login-screen').style.display = 'flex';
        hridInput.value = '';
        passInput.value = '';
        passGroup.style.display = 'none';
    }

    function initApp() {
        renderCashInputs(); attachEventListeners();
        
        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                state = data;
                if (!state.denominations) state.denominations = JSON.parse(JSON.stringify(defaultState.denominations));
                if (!state.bills) state.bills = [];
            } else {
                state = JSON.parse(JSON.stringify(defaultState));
            }
            updateUI();
        });
    }

    function renderCashInputs() {
        const container = document.getElementById('cash-inputs-container');
        container.innerHTML = '';
        denomsList.forEach(denom => {
            const div = document.createElement('div');
            div.className = 'cash-grid';
            div.innerHTML = `<div class="denom-label">${denom}</div><input type="number" class="form-control cash-input" data-denom="${denom}" value="${state.denominations[denom] || ''}" placeholder="العدد" min="0"><div class="total-denom" id="total-${denom}">0</div>`;
            container.appendChild(div);
        });
    }

    function compressImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader(); reader.readAsDataURL(file);
            reader.onload = e => {
                const img = new Image(); img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width; let height = img.height;
                    if (width > height) { if (width > 500) { height *= 500 / width; width = 500; } } 
                    else { if (height > 500) { width *= 500 / height; height = 500; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.4)); 
                };
            };
        });
    }

    function attachEventListeners() {
        const expectedInput = document.getElementById('expected-cash-input');
        expectedInput.addEventListener('input', (e) => { state.expectedCash = parseFloat(e.target.value) || 0; saveAndSync(); });

        document.getElementById('cash-inputs-container').addEventListener('input', (e) => {
            if(e.target.classList.contains('cash-input')) {
                state.denominations[e.target.getAttribute('data-denom')] = parseInt(e.target.value) || 0;
                saveAndSync();
            }
        });

        document.getElementById('bill-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn'); btn.innerHTML = 'جاري الحفظ...'; btn.disabled = true;
            let imageUrl = null;
            try {
                const fileInput = document.getElementById('bill-image');
                if (fileInput.files && fileInput.files[0]) {
                    const imageData = await compressImage(fileInput.files[0]);
                    const formData = new FormData(); formData.append('file', imageData); formData.append('upload_preset', 'abcd123');
                    const uploadRes = await fetch(`https://api.cloudinary.com/v1_1/yk9ursbe/image/upload`, { method: 'POST', body: formData });
                    const uploadData = await uploadRes.json();
                    if(uploadData.secure_url) imageUrl = uploadData.secure_url;
                }
                const now = new Date();
                const selectedName = document.getElementById('bill-name').value;
                const newBill = { 
                    id: Date.now(), 
                    time: `يوم ${now.toLocaleDateString('ar-EG', { weekday: 'long' })} (${now.toLocaleDateString('en-GB')}) - الساعة ${now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute:'2-digit' })}`, 
                    name: selectedName, 
                    reason: document.getElementById('bill-reason').value || 'بدون تفاصيل', 
                    amount: parseFloat(document.getElementById('bill-amount').value), 
                    includeInCalc: true, 
                    image: imageUrl 
                };
                if (!state.bills) state.bills = [];
                state.bills.push(newBill);
                saveAndSync(); e.target.reset(); showToast('تم الحفظ بنجاح');
            } catch(err) { showToast('حدث خطأ أثناء الحفظ', 'error'); } 
            finally { btn.innerHTML = 'حفظ السحب'; btn.disabled = false; }
        });
    }

    window.resetDenominations = function() { 
        if(confirm('هل أنت متأكد من تصفير جميع الفئات النقدية؟')) { 
            denomsList.forEach(denom => state.denominations[denom] = 0); 
            saveAndSync(); 
            showToast('تم تصفير الفئات بنجاح');
        } 
    }

    window.deleteBill = function(id, billCreatorName) {
        if (billCreatorName === "Youssef" && currentUser !== "Youssef") {
            showToast('عفواً، هذه الفاتورة مسجلة على Youssef، ويجب أن يقوم Youssef بحذفها بنفسه!', 'error');
            return;
        }

        if(confirm('هل أنت متأكد من حذف هذه الفاتورة؟')) {
            state.bills = state.bills.filter(bill => bill.id !== id);
            saveAndSync();
            showToast('تم حذف الفاتورة بنجاح');
        }
    }

    window.toggleBillCalc = function(id, checkbox) {
        const bill = state.bills.find(b => b.id === id);
        if (bill) {
            bill.includeInCalc = checkbox.checked;
            saveAndSync();
        }
    }

    window.openImageModal = function(src) { document.getElementById("imgModal").style.display = "flex"; document.getElementById("expandedImg").src = src; }
    window.closeImageModal = function() { document.getElementById("imgModal").style.display = "none"; }

    function updateUI() {
        const expectedInput = document.getElementById('expected-cash-input');
        if(document.activeElement !== expectedInput) expectedInput.value = state.expectedCash || '';

        let totalCash = 0;
        denomsList.forEach(denom => {
            const qty = state.denominations[denom] || 0; totalCash += qty * denom;
            const el = document.getElementById(`total-${denom}`); if(el) el.innerText = formatNum(qty * denom);
            const input = document.querySelector(`.cash-input[data-denom="${denom}"]`);
            if(input && document.activeElement !== input) input.value = qty || '';
        });

        const activeBills = (state.bills || []).filter(b => b.includeInCalc !== false);
        const totalBills = activeBills.reduce((a, b) => a + b.amount, 0);
        
        const diffCalc = totalCash - (state.expectedCash || 0); 
        const finalRemaining = diffCalc + totalBills;

        let finalStatusHtml = '';
        let wrapperClass = 'card final ';

        if (finalRemaining < 0) {
            finalStatusHtml = `<div style="unicode-bidi: plaintext;">${formatNum(Math.abs(finalRemaining))} (عجز)</div>`;
            wrapperClass += 'final-red';
        } else if (finalRemaining > 0) {
            finalStatusHtml = `<div style="unicode-bidi: plaintext;">${formatNum(Math.abs(finalRemaining))} (زيادة)</div>`;
            wrapperClass += 'final-orange';
        } else {
            finalStatusHtml = `<div style="unicode-bidi: plaintext;">0 (مظبوط)</div>`;
            wrapperClass += 'final-green';
        }

        document.getElementById('card-expected').innerText = formatNum(state.expectedCash || 0);
        document.getElementById('card-total-cash').innerText = formatNum(totalCash);
        document.getElementById('card-difference').innerText = formatNum(diffCalc);
        document.getElementById('card-total-bills').innerText = formatNum(totalBills);
        
        document.getElementById('card-final').innerHTML = finalStatusHtml;

        const wrapper = document.getElementById('card-final-wrapper');
        wrapper.className = wrapperClass;

        const tbody = document.getElementById('bills-table-body'); tbody.innerHTML = '';
        if(!state.bills || state.bills.length === 0) return tbody.innerHTML = `<tr><td colspan="3" style="text-align: center;">لا توجد فواتير</td></tr>`;
        
        const grouped = {};
        state.bills.forEach(b => { if(!grouped[b.name]) grouped[b.name] = { total: 0, items: [] }; grouped[b.name].items.push(b); grouped[b.name].total += b.amount; });
        
        for (const [name, data] of Object.entries(grouped)) {
            let detailsHTML = data.items.map(b => {
                const isChecked = b.includeInCalc !== false ? 'checked' : '';
                return `
                <div class="bill-item">
                    <div class="bill-header-row">
                        <div class="bill-time">${b.time}</div>
                        <div class="bill-actions-left">
                            <label style="font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 4px;" title="حساب في الإجمالي">
                                <input type="checkbox" class="calc-checkbox" ${isChecked} onchange="window.toggleBillCalc(${b.id}, this)"> حساب
                            </label>
                            <button class="delete-btn" onclick="window.deleteBill(${b.id}, '${b.name}')" title="حذف الفاتورة"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>
                    <div><b>${b.reason}</b>: ${formatNum(b.amount)} ج.م</div>
                    ${b.image ? `<img src="${b.image}" class="bill-thumb" onclick="window.openImageModal('${b.image}')">` : ''}
                </div>`;
            }).join('');
            
            const groupActiveTotal = data.items.filter(b => b.includeInCalc !== false).reduce((sum, item) => sum + item.amount, 0);

            tbody.innerHTML += `<tr><td style="font-weight: bold;">${name}</td><td>${detailsHTML}</td><td style="font-weight: bold; color: var(--primary);">${formatNum(groupActiveTotal)} ج.م</td></tr>`;
        }
    }

    function showToast(msg, type='success') { const t = document.getElementById('toast'); document.getElementById('toast-message').innerText = msg; t.className = 'toast show ' + (type==='error'?'toast-error':'toast-success'); setTimeout(()=>t.classList.remove('show'), 3000); }
    function saveAndSync() { set(dbRef, state); updateUI(); }
</script>
</body>
</html>
